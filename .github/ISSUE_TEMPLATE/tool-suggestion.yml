name: Suggest a tool
description: Suggest a new AI tool or related project for the catalog
title: "Add: "
labels: []
body:
  - type: input
    id: name
    attributes:
      label: Project name
      placeholder: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL or repository
      description: Include a source we can verify.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: A concise, factual explanation (not marketing copy).
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Agents & Automation
        - Developer Tools
        - Data & Documents
        - Web & Monitoring
        - Media & Creative
        - Learning & Research
        - Finance
        - 3D & Interactive
        - Open Source Apps
    validations:
      required: true
  - type: dropdown
    id: resourceType
    attributes:
      label: Resource type
      description: What exactly is being shared? Use the project's official documentation, not its hosting platform.
      options:
        - Application
        - CLI / Developer Tool
        - Agent Skill
        - MCP Server
        - Library / Framework
        - Directory / Collection
        - Learning Resource
        - Project / Demo
    validations:
      required: true
  - type: dropdown
    id: aiInvolvement
    attributes:
      label: AI involvement
      description: Distinguish AI-powered features from tools that merely support AI workflows.
      options:
        - Core AI
        - Optional AI
        - AI ecosystem
        - No AI required
        - Unverified
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Canonical repository URL (if different)
      description: Link the original upstream project, not a social media post or a random fork.
  - type: checkboxes
    id: duplicateCheck
    attributes:
      label: Duplicate check
      options:
        - label: I searched the catalog by project name, alternative names, and official website or repository.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context or limitations (optional)
