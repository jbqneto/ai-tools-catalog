name: Check site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check for high and critical npm vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate Astro build and catalog schema
        run: npm run build
