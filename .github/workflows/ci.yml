name: Check site

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recalculate lockfile for Astro version merged from main (diagnostic only)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install resolved dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Astro build and catalog schema
        run: npm run build
      - name: Report npm vulnerabilities (diagnostic only)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          console.log('NPM_AUDIT_DIAGNOSTICS_START');
          console.log(JSON.stringify({
            summary: data.metadata?.vulnerabilities,
            vulnerabilities: Object.entries(data.vulnerabilities || {}).map(([name, item]) => ({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, effects: item.effects,
              advisories: item.via.map(v => typeof v === 'string'
                ? { dependency: v }
                : { title: v.title, url: v.url, range: v.range, severity: v.severity }),
              fixAvailable: item.fixAvailable
            }))
          }, null, 2));
          console.log('NPM_AUDIT_DIAGNOSTICS_END');
          NODE
